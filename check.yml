# Prueba automática de BioPeat en cada subida. Resultado en la pestaña Actions:
# ✓ verde = la app arranca y todo funciona · ✗ rojo = algo se ha roto (abre la tarea para ver qué).
# No afecta a la publicación ni a tus datos.
name: Prueba BioPeat
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tests/smoke.py
